<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/imagekit-javascript/dist/imagekit.min.js"></script>
    <title>Shoes Hub</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="header-row">
        <div>
          <h2>Shoes Hub</h2>
          <p class="subtitle">Upload WebP and Generate Post</p>
        </div>
        <button
          id="resetBtn"
          class="icon-btn"
          onclick="resetForm()"
          title="Clear everything"
        >
          &#x21bb;
        </button>
      </div>

      <!-- TYPE SELECTION (Faqat Shoes va Auction) -->
      <div class="tab-switcher">
        <button
          id="tabWatch"
          class="tab-btn active"
          onclick="switchTab('watch')"
        >
          👟 Shoes
        </button>
        <button id="tabAuction" class="tab-btn" onclick="switchTab('auction')">
          🔨 Auction
        </button>
      </div>

      <!-- Asosiy ma'lumotlar -->
      <div class="section-title">Main Information</div>
      <div class="form-group">
        <div class="row">
          <input type="text" id="watchId" placeholder="ID (auto)" readonly />
          <select id="watchStatus">
            <option value="active" selected>Status: Active</option>
            <option value="no-active">Status: No-Active</option>
          </select>
        </div>

        <!-- MODEL KODI -->
        <div class="row" style="margin-top: 8px">
          <input
            type="text"
            id="watchRefCode"
            placeholder="Model / Artikul kodi (masalan: DV0788-100)"
          />
        </div>

        <!-- BREND (Text Input) -->
        <div class="row" style="margin-top: 8px">
          <input
            type="text"
            id="watchBrand"
            placeholder="Brand (e.g., Nike, Adidas, Puma)"
          />
        </div>

        <!-- SALE STATUS (Faqat Shoes rejimi uchun) -->
        <div id="saleSelectRow" class="row" style="margin-top: 8px">
          <select id="shoeSaleType">
            <option value="no-sale" selected>
              Skidkada: no-sale (Skidkasiz)
            </option>
            <option value="sale">
              Skidkada: sale (🏷️ Skidkadagi mahsulot)
            </option>
          </select>
        </div>

        <!-- Karta sarlavhasi / Nomi -->
        <input
          type="text"
          id="watchCardTitle"
          placeholder="Card Title (e.g., Nike Air Force 1 '07)"
          style="margin-top: 8px"
        />

        <!-- Narx va Valyuta kursi (Shoes rejimida ko'rinadi) -->
        <div id="priceRow" class="row" style="margin-top: 8px">
          <input
            type="number"
            id="watchPriceUzsum"
            placeholder="Narxi (So'mda)"
          />
          <input
            type="number"
            id="usdExchangeRate"
            placeholder="1$ kursi (masalan: 12800)"
            value="12800"
          />
        </div>

        <!-- Auksion inputlari (So'm va Dollar hisoblagich bilan) -->
        <div
          id="auctionFields"
          class="form-group hidden"
          style="margin-top: 8px"
        >
          <div class="row">
            <input
              type="number"
              id="aucStartPriceUzsum"
              placeholder="Start Price (So'mda)"
            />
            <input
              type="number"
              id="aucBidStepUzsum"
              placeholder="Bid Step (So'mda)"
              value="50000"
            />
          </div>
          <div class="row" style="margin-top: 8px">
            <input
              type="datetime-local"
              id="aucEndTime"
              title="Auction End Time"
            />
          </div>
        </div>
      </div>

      <!-- O'lchamlar (Sizes 35 - 47) -->
      <div class="section-title">Available Sizes (35 - 47)</div>
      <div class="form-group">
        <div
          class="sizes-grid"
          style="
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            gap: 6px;
          "
        >
          <label class="size-item"
            ><input type="checkbox" value="35" class="size-checkbox" />
            35</label
          >
          <label class="size-item"
            ><input type="checkbox" value="36" class="size-checkbox" />
            36</label
          >
          <label class="size-item"
            ><input type="checkbox" value="37" class="size-checkbox" />
            37</label
          >
          <label class="size-item"
            ><input type="checkbox" value="38" class="size-checkbox" />
            38</label
          >
          <label class="size-item"
            ><input type="checkbox" value="39" class="size-checkbox" />
            39</label
          >
          <label class="size-item"
            ><input type="checkbox" value="40" class="size-checkbox" />
            40</label
          >
          <label class="size-item"
            ><input type="checkbox" value="41" class="size-checkbox" />
            41</label
          >
          <label class="size-item"
            ><input type="checkbox" value="42" class="size-checkbox" />
            42</label
          >
          <label class="size-item"
            ><input type="checkbox" value="43" class="size-checkbox" />
            43</label
          >
          <label class="size-item"
            ><input type="checkbox" value="44" class="size-checkbox" />
            44</label
          >
          <label class="size-item"
            ><input type="checkbox" value="45" class="size-checkbox" />
            45</label
          >
          <label class="size-item"
            ><input type="checkbox" value="46" class="size-checkbox" />
            46</label
          >
          <label class="size-item"
            ><input type="checkbox" value="47" class="size-checkbox" />
            47</label
          >
        </div>
      </div>

      <!-- Texnik xususiyatlar -->
      <div class="section-title">Shoes Specifications</div>
      <div class="form-group">
        <div class="row">
          <input
            type="text"
            id="watchMaterial"
            placeholder="Material (e.g., Natural Leather, Mesh)"
          />
          <input
            type="text"
            id="watchBracelet"
            placeholder="Color (e.g., White / Black)"
          />
        </div>
        <div class="row" style="margin-top: 8px">
          <input
            type="text"
            id="watchGender"
            placeholder="Gender (e.g., Men, Women, Unisex)"
          />
          <input
            type="text"
            id="watchGlass"
            placeholder="Season (e.g., Summer, Winter, All Season)"
          />
        </div>
      </div>

      <!-- Linklar -->
      <div class="section-title">Video Review / Verification</div>
      <div class="form-group">
        <input
          type="text"
          id="watchInstagram"
          placeholder="Instagram link (optional)"
        />
      </div>

      <!-- Tavsif / Comment -->
      <div class="section-title">Description / Comment</div>
      <div class="form-group">
        <textarea
          id="watchDescription"
          class="desc-input"
          placeholder="Shoe description and details..."
        ></textarea>
      </div>

      <!-- Rasm Tanlash -->
      <div class="section-title">Photos (min. 4)</div>
      <div class="upload-box">
        <label for="imageInput" class="upload-label">
          <span>📷 Select Photos (.webp auto)</span>
        </label>
        <input type="file" id="imageInput" multiple accept="image/*" />
      </div>

      <!-- Status -->
      <div id="status" class="status-text"></div>

      <!-- Yuklangan rasmlar previyusi -->
      <div id="previewContainer" class="preview-grid"></div>

      <!-- Tayyor Post Matni -->
      <div class="section-title">Ready Post</div>
      <textarea
        id="resultText"
        readonly
        placeholder="Post text will appear here..."
      ></textarea>

      <!-- Tugmalar -->
      <div class="btn-row">
        <button id="copyBtn" onclick="copyPost()">📋 Copy Post</button>
        <button id="resetBtnBottom" class="secondary-btn" onclick="resetForm()">
          🔄 New Post
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
